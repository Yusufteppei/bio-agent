[project]
name = "bio-agent"
version = "0.0.1"
dependencies = [
    "biopython",
    "torch",
    "transformers",
    "langgraph",
    "peft",
    "requests"
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bio_agent*"]